[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "proof-of-light"
version = "0.0.1"
description = "Phase 0 optical challenge experiment; physical validation pending"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["numpy>=2.2,<3", "scipy>=1.15,<2", "pillow>=11,<13", "fastapi>=0.128,<1", "uvicorn>=0.34,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1", "playwright>=1.50,<2"]

[project.scripts]
pol-verify = "pol_verifier.cli:main"

[tool.setuptools.packages.find]
where = ["packages/verifier/src"]

[tool.pytest.ini_options]
pythonpath = [".", "packages/verifier/src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
