name: Phase 0 checks
on: [push, pull_request]
jobs:
  spike:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install --no-deps -e .
      - run: ruff check apps/api packages scripts tests
      - run: ruff format --check apps/api packages scripts tests
      - run: pytest -q
      - run: node --check apps/spike/capture.js
